            有些自诩"高效、摆脱繁琐约束的新式创作者"，傲慢地认定那些需要耗尽心神培养的审美与感知力，不过是AI能抹平的"小门槛"。他们不允许艺术创作有重复的成分，对真正的创作者过于严苛——却为自己成为技术的无用附庸而感到自豪。
